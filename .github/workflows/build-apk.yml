name: Build PixelTask APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PixelTask ZIP
        run: |
          mkdir project
          unzip "pixeltask (1).zip" -d project
          find project -maxdepth 2 -type f | sort

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelTask-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
