name: Build PixelTask APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PixelTask ZIP
        run: |
          mkdir -p project
          unzip -o "pixeltask (1).zip" -d project

          echo "=== Extracted files ==="
          find project -maxdepth 3 -type f | sort

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Find Android Project
        run: |
          echo "=== Searching for Android project ==="

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Remove Unused Google Services
        run: |
          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          echo "=== Removing unused Google/Firebase configuration ==="

          if [ -f "app/build.gradle.kts" ]; then

            # Remove Google Services plugin lines
            sed -i '/google-services/d' app/build.gradle.kts
            sed -i '/google.services/d' app/build.gradle.kts
            sed -i '/googleServices/d' app/build.gradle.kts

            # Remove Firebase configuration
            sed -i '/firebase-bom/d' app/build.gradle.kts
            sed -i '/firebase\.bom/d' app/build.gradle.kts
            sed -i '/MissingGoogleServicesStrategy/d' app/build.gradle.kts

          fi

          echo "=== Checking remaining Google Services references ==="

          if grep -nEi \
            'google-services|googleServices|google\.services|MissingGoogleServicesStrategy|firebase-bom|firebase\.bom' \
            app/build.gradle.kts; then

            echo "ERROR: Google/Firebase configuration still exists."
            exit 1

          else

            echo "No unwanted Google/Firebase configuration found."

          fi

          echo "=== Final app/build.gradle.kts ==="
          cat app/build.gradle.kts

      - name: Prepare Gradle Wrapper
        run: |
          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          echo "=== Checking Gradle Wrapper ==="

          if [ ! -f "gradlew" ]; then
            echo "gradlew not found."
            echo "Creating Gradle Wrapper..."

            gradle wrapper --gradle-version 9.7.1
          fi

          chmod +x gradlew

          echo "=== Gradle files ==="
          ls -la

      - name: Check Android SDK
        run: |
          echo "=== Installed Android SDK ==="

          sdkmanager --list_installed | grep -E \
            "platforms;android-36|build-tools;36.0.0" || true

      - name: Build APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          echo "=== Building PixelTask APK ==="

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "=== Searching for APK ==="

          find project \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelTask-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
